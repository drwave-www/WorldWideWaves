name: 99 • Pipeline Status

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  checks: read
  contents: read
  actions: read

concurrency:
  group: status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wait-for-workflows:
    name: Wait for Core Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Wait for workflows to complete
        run: |
          echo "Waiting for core workflows to complete..."
          sleep 60  # Wait 1 minute for workflows to register

  status:
    name: Overall Status
    runs-on: ubuntu-latest
    needs: [wait-for-workflows]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for running workflows
        run: |
          echo "Checking for still-running workflows..."

          # Wait up to 45 minutes for workflows to complete
          timeout=2700
          interval=30
          elapsed=0

          while [ $elapsed -lt $timeout ]; do
            running_count=$(gh run list --commit ${{ github.sha }} --json status,name --jq '[.[] | select((.status == "in_progress" or .status == "queued") and .name != "99 • Pipeline Status")] | length')

            if [ "$running_count" -eq 0 ]; then
              echo "✅ All workflows completed"
              break
            fi

            echo "⏳ $running_count workflows still running, waiting..."
            sleep $interval
            elapsed=$((elapsed + interval))
          done

          if [ $elapsed -ge $timeout ]; then
            echo "⚠️ Timeout reached, some workflows may still be running"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get workflow runs
        id: workflow-status
        uses: actions/github-script@v9
        with:
          script: |
            // Get all workflow runs for this commit AFTER waiting
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: context.sha,
              per_page: 100
            });

            const relevantWorkflows = [
              '03 • Quality & Security Gates',
              '01 • Build Android',
              '02 • Build iOS',
              'Test Quality Validation'
            ];

            const workflowResults = {};
            let allPassed = true;

            for (const workflow of relevantWorkflows) {
              const run = runs.workflow_runs.find(r => r.name === workflow);
              if (run) {
                if (run.status === 'completed') {
                  workflowResults[workflow] = run.conclusion;
                  if (run.conclusion !== 'success') {
                    allPassed = false;
                  }
                } else {
                  workflowResults[workflow] = run.status;
                  allPassed = false;
                }
              } else {
                workflowResults[workflow] = 'not_found';
                allPassed = false;
              }
            }

            console.log('Workflow Results:', workflowResults);
            console.log('All Passed:', allPassed);

            core.setOutput('all_passed', allPassed);
            core.setOutput('results', JSON.stringify(workflowResults));
            return workflowResults;

      - name: Create status summary
        env:
          WORKFLOW_RESULTS_JSON: ${{ steps.workflow-status.outputs.results }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results_raw = os.environ.get('WORKFLOW_RESULTS_JSON') or '{}'
          try:
              results = json.loads(results_raw)
          except Exception:
              results = {}

          def icon(conclusion_or_status: str) -> str:
              if conclusion_or_status == 'success':
                  return '✅ success'
              if conclusion_or_status == 'failure':
                  return '❌ failure'
              if conclusion_or_status in ('cancelled', 'skipped', 'timed_out', 'action_required', 'neutral', 'stale'):
                  return f'⚠️ {conclusion_or_status}'
              if conclusion_or_status in ('queued', 'in_progress'):
                  return f'⏳ {conclusion_or_status}'
              if conclusion_or_status == 'not_found':
                  return '❔ not_found'
              if not conclusion_or_status:
                  return '❔ unknown'
              return conclusion_or_status

          # Map workflow run names -> display labels in the summary
          rows = [
              ('03 • Quality & Security Gates', 'Quality & Security Gates'),
              ('01 • Build Android', 'Build Android'),
              ('02 • Build iOS', 'Build iOS'),
              ('Test Quality Validation', 'Test Quality Validation'),
          ]

          print('## 🚀 WorldWideWaves CI/CD Status Summary')
          print('')
          print('| Workflow | Status |')
          print('|----------|--------|')

          for workflow_name, label in rows:
              status = results.get(workflow_name, 'not_found')
              print(f'| {label} | {icon(status)} |')
          PY

      - name: Final status check
        run: |
          if [ "${{ steps.workflow-status.outputs.all_passed }}" = "true" ]; then
            echo "✅ All workflows passed successfully!"
            echo "STATUS=success" >> $GITHUB_ENV
          else
            echo "❌ Some workflows failed or are missing"
            echo "STATUS=failure" >> $GITHUB_ENV
            exit 1
          fi