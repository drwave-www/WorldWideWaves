kotlin.code.style=official
#Gradle
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
org.gradle.jvmargs=-Xmx6g -XX:MaxDirectMemorySize=6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx6g"
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true
#Kotlin Multiplatform <-> Android Gradle Plugin compatibility
#kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
#BuildConfig
# android.enableBuildConfigAsBytecode=true  # Commented out - experimental feature causing warnings
kotlin.apple.xcodeCompatibility.nowarn=true

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.workers.max=2

# Disable Moko static framework warnings
moko.resources.disableStaticFrameworkWarning=true

# Workaround for Kotlin Native compilation issues with androidx.annotation.IntRange
kotlin.native.cacheKind=none
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Suppress AGP 9.0 sync warnings about library constraints
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# Workaround for AGP 9.0 stricter Provider validation in SourceSet API
# Required until moko-resources and compose-resources plugins migrate to Variant API
android.sourceset.disallowProvider=false